name: CI / Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
      timezone: 'Asia/Kolkata'

# Least privilege by default; the deploy job opts into what it needs.
permissions:
  contents: read

# Pull-request builds are cancelled when superseded. Deploys are never cancelled mid-flight.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real secrets: push, schedule and manual runs.
      - name: Generate environment file
        if: github.event_name != 'pull_request'
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          WEB3FORMS_URL: ${{ secrets.WEB3FORMS_URL }}
        run: |
          test -n "$WEB3FORMS_KEY" || { echo "::error::WEB3FORMS_KEY secret is empty"; exit 1; }
          test -n "$WEB3FORMS_URL" || { echo "::error::WEB3FORMS_URL secret is empty"; exit 1; }
          node -e "
            const fs = require('fs');
            const env = {
              production: true,
              web3formsKey: process.env.WEB3FORMS_KEY,
              web3Fromslink: process.env.WEB3FORMS_URL
            };
            fs.mkdirSync('src/environments', { recursive: true });
            fs.writeFileSync(
              'src/environments/environment.ts',
              'export const environment = ' + JSON.stringify(env, null, 2) + ';\n'
            );
          "

      # Pull requests (including Dependabot) cannot read repository secrets,and a build check does not need the real values.
      - name: Generate placeholder environment file (PR builds)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p src/environments
          printf 'export const environment = {\n  production: true,\n  web3formsKey: "pr-build-placeholder",\n  web3Fromslink: "https://example.invalid"\n};\n' > src/environments/environment.ts

      - name: Build
        run: npx ng build --base-href /my-portfolio/ --configuration production

      - name: Smoke check build output
        run: |
          out=dist/portfolio/browser
          test -s "$out/index.html" || { echo "::error::index.html missing or empty"; exit 1; }
          test -s "$out/assets/documents/Jothi_Sankar_Resume_2026.pdf" || { echo "::error::Resume PDF missing from build"; exit 1; }

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/portfolio/browser

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1