<div class="section-alt-bg">
  <section class="section-wrap" id="skills">

    <div class="section-header">
      <span class="section-num">03</span>
      <h2>Technical Skills & Tools</h2>
    </div>

    <!-- Icon-first logo wall, grouped by category -->
    <div class="logo-wall">
      @for (cat of categories; track cat.heading) {
      <div class="logo-category">
        <h4>{{ cat.heading }}</h4>
        <div class="logo-grid">
          @for (item of cat.items; track item.name) {
          @if (item.evidence) {
          <button type="button" class="logo-tile logo-tile--certified"
            [attr.title]="item.name + ' — ' + item.badge + ' certified'" (click)="openEvidence(item.evidence)"
            [attr.aria-label]="'View evidence for ' + item.badge + ' ' + item.name + ' certification'">
            <img class="logo-tile-icon" [src]="item.iconSrc" [alt]="item.name" loading="lazy"
              (error)="onIconError($event)" />
            <span class="logo-tile-name">{{ item.name }}</span>
            <span class="logo-tile-badge">{{ item.badge }}</span>
          </button>
          } @else {
          <div class="logo-tile" [attr.title]="item.name">
            <img class="logo-tile-icon" [src]="item.iconSrc" [alt]="item.name" loading="lazy"
              (error)="onIconError($event)" />
            <span class="logo-tile-name">{{ item.name }}</span>
          </div>
          }
          }
        </div>
      </div>
      }
    </div>

  </section>
</div>

<app-lightbox [evidence]="activeEvidence()" (closed)="closeEvidence()"></app-lightbox>
